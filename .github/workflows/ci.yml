name: CI

on:
  push:
    branches: [main, "phase-*"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gy
          POSTGRES_PASSWORD: gy_test_password
          POSTGRES_DB: ghumakkadyatri_test
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U gy" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://gy:gy_test_password@localhost:5433/ghumakkadyatri_test
      JWT_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
      ENVIRONMENT: test
      COOKIE_SECURE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app tests
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Phase 6: apply database migrations to production (Neon) after tests pass on main.
  # Needs repository secret MIGRATION_DATABASE_URL (Neon direct URL, main branch).
  migrate:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
      DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
      JWT_SECRET: migration-only-not-used-for-sessions-000
    steps:
      - uses: actions/checkout@v4
      - name: Skip when the secret is not configured yet
        id: check
        run: |
          if [ -z "$MIGRATION_DATABASE_URL" ]; then echo "No MIGRATION_DATABASE_URL secret; skipping."; echo "run=false" >> "$GITHUB_OUTPUT"; else echo "run=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-python@v5
        if: steps.check.outputs.run == 'true'
        with:
          python-version: "3.12"
      - if: steps.check.outputs.run == 'true'
        run: pip install -r requirements-dev.txt && alembic upgrade head
