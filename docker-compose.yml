# Local PostgreSQL for development and tests (backend-spec §11).
#   docker compose up -d db db-test
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: gy
      POSTGRES_PASSWORD: gy_dev_password
      POSTGRES_DB: ghumakkadyatri
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

  db-test:
    image: postgres:16
    environment:
      POSTGRES_USER: gy
      POSTGRES_PASSWORD: gy_test_password
      POSTGRES_DB: ghumakkadyatri_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data

volumes:
  db-data:
